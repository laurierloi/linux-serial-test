name: serial-regression
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Strict build and static analysis
        run: gcc -std=gnu11 -O2 -Wall -Wextra -Werror -fanalyzer linux-serial-test.c -o linux-serial-test
      - name: PTY and mocked driver regressions
        run: python3 -m unittest discover -s tests -v
      - name: Undefined behavior checks
        run: |
          gcc -std=gnu11 -O1 -g -Wall -Wextra -Werror -fsanitize=undefined -fno-sanitize-recover=all linux-serial-test.c -o linux-serial-test
          python3 -m unittest discover -s tests -v
      - name: Build release image
        run: |
          docker build -f tests/build.Dockerfile -t serial-build .
          mkdir -p build
          docker image inspect serial-build --format '{{.Id}}' > build/image-id
      - name: Build and test exact release binaries
        run: |
          docker run --rm -v "$PWD:/src" serial-build sh -eu -c '
            git config --global --add safe.directory /src
            tests/build.sh
            SERIAL_TEST_BINARY=/src/build/linux-serial-test-host python3 -m unittest discover -s tests -v
            SERIAL_TEST_BINARY=/src/tests/run-arm.sh python3 -m unittest discover -s tests -v
          '
      - name: Package tested binaries and provenance
        run: |
          docker run --rm -e GITHUB_REF_TYPE -e GITHUB_REF_NAME -v "$PWD:/src" serial-build sh -eu -c '
            git config --global --add safe.directory /src
            python3 tests/package_release.py
          '
      - uses: actions/upload-artifact@v4
        with:
          name: serial-release-${{ github.sha }}
          path: build/release/
          if-no-files-found: error
  publish:
    needs: regression
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: serial-release-${{ github.sha }}
          path: release
      - name: Publish versioned release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -eu
          cd release
          sha256sum -c SHA256SUMS
          test "$(jq -r .version manifest.json)" = "$RELEASE_TAG"
          test "$(jq -r .revision manifest.json)" = "$GITHUB_SHA"
          # Create a draft first: all assets must be present before immutability.
          gh release create "$RELEASE_TAG" --verify-tag --draft --title "$RELEASE_TAG" --notes "Static x86-64 and ARM hard-float builds. Source: $GITHUB_SHA. See manifest.json and SHA256SUMS for provenance. Hardware qualification is separate from CI regression checks."
          gh release upload "$RELEASE_TAG" linux-serial-test-linux-x86_64 linux-serial-test-linux-armhf manifest.json SHA256SUMS
          case "$RELEASE_TAG" in
            *-*) gh release edit "$RELEASE_TAG" --draft=false --prerelease --latest=false ;;
            *) gh release edit "$RELEASE_TAG" --draft=false --prerelease=false --latest ;;
          esac
          test "$(gh api "repos/$GH_REPO/releases/tags/$RELEASE_TAG" --jq .immutable)" = true
